name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, zero runtime deps)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: |
          extra-brain --db /tmp/smoke.db init > /dev/null
          extra-brain --db /tmp/smoke.db stats
          extra-brain --db /tmp/smoke.db list semantic
