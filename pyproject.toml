[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extra-brain"
version = "0.13.0"
description = "Auditable long-term memory for companion AI agents"
readme = "docs/README.md"
requires-python = ">=3.11"
authors = [{ name = "small_fat_fish contributors" }]
dependencies = []

[project.scripts]
extra-brain = "extra_brain.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
